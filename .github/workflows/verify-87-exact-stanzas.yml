name: EQE 87 - detectar estrofas identicas sin acordes (solo lectura)
on:
  push:
    branches: [audit-87-exact-stanza-repeat-20261010]
    paths: [".github/workflows/verify-87-exact-stanzas.yml"]
permissions:
  contents: read
jobs:
  repeat-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias para lectura
        run: pip install requests beautifulsoup4
      - name: Validar las 87 canciones y las 23 de La Pasma sin escribir
        env:
          APPLY_SAFE_REPEATS: "0"
        run: |
          python -m py_compile scripts/audit_repeated_chords_86.py scripts/audit_songbook.py
          python scripts/audit_repeated_chords_86.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-87-estofas-iguales-pendientes
          path: eqe-repeat-chord-audit/REPEAT_CHORD_PREFLIGHT.json
          retention-days: 21
          if-no-files-found: warn
