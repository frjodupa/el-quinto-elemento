name: LA PASMA - cotejo de fuentes originales para canciones incompletas
on:
  push:
    branches: [audit-la-pasma-23-deep-20261010]
    paths: [.github/workflows/audit-pasma-23-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - name: Build verified scraper and Python dependencies
        run: |
          pip install requests beautifulsoup4
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ultimate-guitar-scraper
          cp scripts/ug_audit.go /tmp/ultimate-guitar-scraper/ug_audit.go
          (cd /tmp/ultimate-guitar-scraper && go build -o /tmp/ug-audit ./ug_audit.go)
      - name: Compare only eight weak LA PASMA tracks against original artists
        env:
          UG_HELPER: /tmp/ug-audit
          REQUEST_DELAY: '2'
          MAX_FETCHES_PER_SONG: '3'
        run: |
          python -m py_compile scripts/audit_multi_ug_low_coverage.py
          python scripts/audit_multi_ug_low_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: la-pasma-8-weak-original-source-audit
          path: pasma-sources-audit/ALL_WEAK_SONG_SOURCES.json
          retention-days: 21
          if-no-files-found: warn
