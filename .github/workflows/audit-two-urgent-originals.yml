name: EQE - Fuente independiente Aquí no hay playa y Qué Navidad
on:
  push:
    branches: [audit-alt-chord-sources-86-20261010]
    paths: [.github/workflows/audit-two-urgent-originals.yml, scripts/audit_two_priority_sources.py]
permissions:
  contents: read
jobs:
  independently-review-two-most-incomplete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Compare original-artist chord sheets to current D1 without writing
        env:
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
          REQUEST_DELAY: '2'
        run: |
          python -m py_compile scripts/audit_two_priority_sources.py
          python scripts/audit_two_priority_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-urgentes-segunda-fuente-acordes
          path: eqe-priority-outside-sources/READONLY_PRIORITY_SOURCE_AUDIT.json
          retention-days: 30
          if-no-files-found: warn
