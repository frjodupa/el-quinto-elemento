name: EQE - Convertir 99 acordes ocultos a lineas (solo simulacion)
on:
  push:
    branches: [audit-alt-chord-sources-86-20261010]
    paths: [.github/workflows/check-aqui-hidden-chords.yml]
permissions:
  contents: read
jobs:
  safe-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Verify all lyric lines retained, chord indices migrated and intro preserved
        env:
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
          APPLY_AQUI_SCAFFOLDS: '0'
        run: |
          python -m py_compile scripts/convert_aqui_embedded_chords.py
          python scripts/convert_aqui_embedded_chords.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-Aqui-No-Hay-Playa-99-recovered-chords-preview
          path: eqe-aqui-chord-conversion/PREVIEW.json
          retention-days: 30
          if-no-files-found: warn
