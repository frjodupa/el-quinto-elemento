name: Verify public v79 full song editor
on:
  push:
    branches: [verify-v79-live-song-editor-20261010]
    paths: [.github/workflows/verify-v79-live-editor.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check live UI and offline technical version
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          root='https://crimson-rice-1fe1.joseduqueparedes.workers.dev'
          def read(path):
            url=root+path+('&' if '?' in path else '?')+'v79check='+str(int(time.time()*1000))
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'EQE-Live-Editor-Verification/1.0'})
            with urllib.request.urlopen(req,timeout=20) as r:
              return r.read().decode('utf-8','replace')
          for attempt in range(1,10):
            html=read('/')
            v79='class="uiVersion">v79' in html
            menu=all('id="'+name+'"' in html for name in (
              'quickEditLyricsBtn','quickEditTitleBtn','quickEditChordsBtn','quickEditIntroBtn','quickEditInstrumentalBtn'))
            css='premium.css?v=83' in html
            print('ATTEMPT',attempt,'UI_79',v79,'EDIT_MENU_5',menu,'NEW_CSS',css,flush=True)
            if v79 and menu and css: break
            time.sleep(9)
          else: raise RuntimeError('v79 editor not visible on Cloudflare yet')
          script=read('/song-quick-edit.js')
          for f in ('selectLyrics','selectTitle','selectChords','selectIntro','selectInstrumental'):
            if 'function '+f+'(' not in script:raise RuntimeError('Missing handler: '+f)
          print('SONG_EDITOR_HANDLERS=5',flush=True)
          css=read('/premium.css')
          if 'v79 · editor rápido completo' not in css:raise RuntimeError('Old CSS')
          sw=read('/sw.js')
          if 'quinto-elemento-v83' not in sw:raise RuntimeError('Old service worker')
          version=json.loads(read('/version.json'))
          if version.get('version')!=83:raise RuntimeError('Old version.json')
          print('LIVE_SONG_EDIT_79_VERIFIED=YES',flush=True)
          PY
