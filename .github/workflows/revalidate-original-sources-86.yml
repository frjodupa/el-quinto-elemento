name: EQE - auditoría integral 86 originales y acordes (NO ESCRIBE)
on:
  push:
    branches: [audit-repeated-chord-lines-86-20261010]
    paths: [.github/workflows/revalidate-original-sources-86.yml]
permissions:
  contents: read
jobs:
  audit-86:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verified source tooling
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p /tmp/eqe-node
          git clone --depth 1 https://github.com/olimontes/setlive.git /tmp/setlive
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ug
          git clone --depth 1 https://github.com/mfuentesg/capo.git /tmp/capo
          cp scripts/ug_audit.go /tmp/ug/ug_audit.go
          (cd /tmp/ug && go build -o /tmp/ug-audit ./ug_audit.go)
          CAPO_VERSION=$(node -e "const p=require('/tmp/capo/package.json'); console.log(String(p.dependencies.chordsheetjs).replace(/^[^0-9]*/,''))")
          npm install --prefix /tmp/eqe-node --no-audit --no-fund "chordsheetjs@$CAPO_VERSION"
      - name: Full 86-song current-source comparison, lyrics match, chord coverage (READ ONLY)
        env:
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
          SETLIVE_SCRAPER_PATH: /tmp/setlive/backend/apps/repertoire/cifra_scraper.py
          UG_HELPER: /tmp/ug-audit
          CHORDPRO_CONVERTER: scripts/chordpro_convert.cjs
          NODE_PATH: /tmp/eqe-node/node_modules
          REQUEST_DELAY: "2"
          APPLY_TO_LIVE: "0"
          REPORT_ONLY: "1"
          AUDIT_OUT: source_86_output
        run: |
          python scripts/audit_songbook.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-86-full-source-audit-20261010
          path: |
            source_86_output/AUDITORIA_REPORT.md
            source_86_output/SOURCE_URLS.txt
            source_86_output/RUN_STATUS.json
            source_86_output/raw/*.json
            source_86_output/diff/*.md
          retention-days: 21
          if-no-files-found: warn
