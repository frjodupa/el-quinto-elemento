name: EQE - acordes originales de 3 canciones prioritarias (sin alterar D1)
on:
  push:
    branches: [audit-eqe-harmony-priority-20261010]
    paths: [.github/workflows/check-original-harmony-priority.yml]
permissions:
  contents: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependencies
        run: pip install requests beautifulsoup4
      - name: Cross-check original chords, keys and existing placement (READ ONLY)
        env:
          LIVE_BASE: "https://crimson-rice-1fe1.joseduqueparedes.workers.dev"
          APPLY_TO_LIVE: "0"
          REPORT_ONLY: "1"
          REQUEST_DELAY: "2"
        run: |
          python -m py_compile scripts/check_original_harmony_priority.py
          python scripts/check_original_harmony_priority.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqe-88-original-harmony-three-targets
          path: eqe-priority-harmony-audit/PRIORITY_HARMONY_SOURCE_CHECK.json
          retention-days: 30
          if-no-files-found: warn
