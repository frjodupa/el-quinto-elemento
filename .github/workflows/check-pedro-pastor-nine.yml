name: EQE - Validar 9 acordes Pedro Pastor sin escritura
on:
  push:
    branches: [audit-alt-chord-sources-86-20261010]
    paths: [.github/workflows/check-pedro-pastor-nine.yml, scripts/patch_los_olvidados_verified.py]
permissions:
  contents: read
jobs:
  validate-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install verified source reader
        run: pip install requests beautifulsoup4
      - name: Verify exact source, title, keys, 9 empty lines and snapshot
        env:
          APPLY_VERIFIED_LOS_OLVIDADOS: '0'
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
          REQUEST_DELAY: '2'
        run: |
          python -m py_compile scripts/patch_los_olvidados_verified.py
          python scripts/patch_los_olvidados_verified.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-Los-Olvidados-nine-chords-preflight
          path: eqe-los-olvidados-guarded/PREVIEW.json
          if-no-files-found: warn
          retention-days: 14
