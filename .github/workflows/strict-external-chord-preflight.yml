name: EQE - validar tonalidad y acordes externos sin alterar repertorio
on:
  push:
    branches: [audit-repeated-chord-lines-86-20261010]
    paths: [.github/workflows/strict-external-chord-preflight.yml]
permissions:
  contents: read
jobs:
  independent-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Compile verified Ultimate Guitar scraper
        run: |
          python -m pip install requests beautifulsoup4
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ug-src
          cp scripts/ug_audit.go /tmp/ug-src/ug_audit.go
          (cd /tmp/ug-src && go build -o /tmp/ug-audit ./ug_audit.go)
      - name: Check pinned original sources against live chord positions READ ONLY
        env:
          UG_HELPER: /tmp/ug-audit
          REQUEST_DELAY: "2"
          APPLY_ORIGINAL_STRICT: "0"
        run: |
          python -m py_compile scripts/strict_original_patch_candidates.py
          python scripts/strict_original_patch_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-strict-original-source-positions
          path: eqe-original-song-strict/EXTERNAL_STRICT_PREFLIGHT.json
          retention-days: 21
          if-no-files-found: warn
