name: EQE - verificar 87 actuales y los acordes incrustados restantes
on:
  push:
    branches: [audit-alt-chord-sources-86-20261010]
    paths: [.github/workflows/recheck-after-aqui.yml]
permissions:
  contents: read
jobs:
  recheck-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Check all songs, setlists and remaining chord text metadata
        env:
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
        run: |
          python scripts/audit_current_chord_coverage.py
          python scripts/inspect_remaining_embedded_chords.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-87-post-patch-coverage-audit
          path: eqe-current-audit/LINE_COVERAGE_FULL.json
          retention-days: 30
          if-no-files-found: warn
