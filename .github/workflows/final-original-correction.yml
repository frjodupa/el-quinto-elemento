name: Correccion final fuentes originales

on:
  push:
    branches:
      - cancionero-v63-export
    paths:
      - ".github/workflows/final-original-correction.yml"
      - "scripts/final_original_correction.py"

permissions:
  actions: write
  contents: read

jobs:
  correct-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Cancel redundant older branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/old-runs.txt
          import json, os, urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs?branch=cancionero-v63-export&status=in_progress&per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          current=int(os.environ["CURRENT_RUN"])
          for run in data.get("workflow_runs", []):
              rid=int(run["id"])
              if rid != current:
                  print(rid)
          PY

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Cancelling redundant run $run_id"
            curl -fsSL -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
          done < /tmp/old-runs.txt

      - name: Checkout final branch state
        uses: actions/checkout@v4
        with:
          ref: cancionero-v63-export
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          git clone --depth 1 https://github.com/olimontes/setlive.git /tmp/setlive
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ultimate-guitar-scraper
          git clone --depth 1 https://github.com/mfuentesg/capo.git /tmp/capo
          cp scripts/ug_audit.go /tmp/ultimate-guitar-scraper/ug_audit.go
          (cd /tmp/ultimate-guitar-scraper && go build -o /tmp/ug-audit ./ug_audit.go)
          CAPO_VERSION=$(node -e "const p=require('/tmp/capo/package.json'); console.log(String(p.dependencies.chordsheetjs).replace(/^[^0-9]*/,''))")
          mkdir -p /tmp/audit-node
          npm install --prefix /tmp/audit-node --no-audit --no-fund "chordsheetjs@$CAPO_VERSION"

      - name: Download pre-audit per-song backups from authoritative run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL -L             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/artifacts/11659966907/zip"             -o /tmp/run3.zip
          mkdir -p /tmp/run3
          unzip -q /tmp/run3.zip -d /tmp/run3
          for id in 4 6 73 87 78 92; do
            test -f "/tmp/run3/backup/${id}_v62.json"
          done

      - name: Correct only non-original sources
        env:
          LIVE_BASE: "https://crimson-rice-1fe1.joseduqueparedes.workers.dev"
          SETLIVE_SCRAPER_PATH: "/tmp/setlive/backend/apps/repertoire/cifra_scraper.py"
          UG_HELPER: "/tmp/ug-audit"
          CHORDPRO_CONVERTER: "scripts/chordpro_convert.cjs"
          NODE_PATH: "/tmp/audit-node/node_modules"
          REQUEST_DELAY: "2"
          RUN3_BACKUP_DIR: "/tmp/run3/backup"
          CORRECTION_OUT: "final_correction"
        run: |
          python -m py_compile scripts/audit_songbook.py scripts/final_original_correction.py
          python scripts/final_original_correction.py

      - name: Record deploy availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Frontend v64 / technical 67 NOT deployed: Cloudflare GitHub secrets are not configured." > final_correction/DEPLOY_STATUS.txt
          else
            echo "Cloudflare secrets detected; deployment can proceed." > final_correction/DEPLOY_STATUS.txt
            npm ci
            npx wrangler deploy 2>&1 | tee -a final_correction/DEPLOY_STATUS.txt
          fi

      - name: Upload final corrected package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancionero-v64-original-corregido
          path: final_correction/
          if-no-files-found: warn
          retention-days: 30
