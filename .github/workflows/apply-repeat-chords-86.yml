name: EQE - aplicar acordes inequívocos de estribillos repetidos con respaldo
on:
  push:
    branches: [apply-safe-repeated-chords-86-20261010]
    paths: [.github/workflows/apply-repeat-chords-86.yml]
permissions:
  contents: read
jobs:
  backed-up-chord-only-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install requests beautifulsoup4
      - name: Revalidate 86-song live inventory, backup D1 and apply only proven repeated chords
        env:
          APPLY_SAFE_REPEATS: "1"
        run: |
          python -m py_compile scripts/audit_songbook.py scripts/audit_repeated_chords_86.py
          python scripts/audit_repeated_chords_86.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-applied-verified-repeated-chords
          path: |
            eqe-repeat-chord-audit/REPEAT_CHORD_PREFLIGHT.json
            eqe-repeat-chord-audit/REPEAT_CHORD_APPLIED.json
          retention-days: 21
          if-no-files-found: warn
