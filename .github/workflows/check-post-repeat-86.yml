name: EQE - medir cobertura tras 199 acordes nuevos
on:
  push:
    branches: [audit-repeated-chord-lines-86-20261010]
    paths: [.github/workflows/check-post-repeat-86.yml]
permissions:
  contents: read
jobs:
  recount:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Re-read Cloudflare and count missing chord lines for all songs
        run: python scripts/audit_current_chord_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-after-199-new-chords-coverage
          path: |
            eqe-current-audit/AUDITORIA_COBERTURA.md
            eqe-current-audit/LINE_COVERAGE_FULL.json
          retention-days: 21
          if-no-files-found: warn
