name: EQE v78 light-theme accessibility check
# Re-run after adding alphabetical song assertions and fixing fixture selector.
on:
  push:
    branches: [fix-v78-light-theme-chord-contrast-20261010]
    paths: ['.github/workflows/check-v78-light-theme.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrast-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Chromium smoke tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Assert visible word/line chords, sections, buttons and labels
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/eqe-v78-http.log 2>&1 &
          sleep 2
          node scripts/test-light-theme-contrast.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqe-v78-daylight-contrast-screenshots
          retention-days: 14
          if-no-files-found: warn
          path: |
            ui-review/*.png
            ui-review/contrast-summary.json
