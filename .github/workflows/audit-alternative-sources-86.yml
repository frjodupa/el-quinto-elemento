name: EQE auditoría secundaria de acordes originales (86)
on:
  push:
    branches: [audit-alt-chord-sources-86-20261010]
    paths: [.github/workflows/audit-alternative-sources-86.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-secondary-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Verify live repertoire plus alternate chord sheets, NO WRITES
        env:
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
          REQUEST_DELAY: '2'
          APPLY_SAFE_REPEATS: '0'
          APPLY_ORIGINAL_STRICT: '0'
        run: |
          python -m py_compile scripts/audit_alternative_sources_86.py
          python scripts/audit_current_chord_coverage.py
          python scripts/audit_alternative_sources_86.py
      - name: Upload metadata-only results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-86-coverage-and-alternative-original-sources
          retention-days: 30
          if-no-files-found: warn
          path: |
            eqe-current-audit/LINE_COVERAGE_FULL.json
            eqe-alternative-sources/ALTERNATIVE_CHORD_SOURCE_REPORT.json
