name: EQE - Verificar sincronización segura (rama aislada)
on:
  push:
    branches:
      - gitop/sync-safe-ipad-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de conciliación sin acceso a nube
        run: node scripts/test-sync-safe.cjs
      - name: Validar sintaxis del motor y scripts de index.html
        run: |
          node --check public/sync-engine.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s=fs.readFileSync('public/index.html','utf8');
          const scripts=s.split('<script>').slice(1).map(x=>[x.split('</script>')[0]]);
          let count=0;
          scripts.forEach(m=>{if(m[1].trim()){new vm.Script(m[1]);count++}});
          if(!s.includes('<script src="./sync-engine.js"></script>'))throw Error('falta motor');
          console.log('PASS inline scripts '+count);
          NODE
      - name: Regresiones existentes
        run: |
          node scripts/test-pwa-version.cjs
          node scripts/test-repeated-chords.cjs
          node scripts/test-eqe-global-regressions.cjs
