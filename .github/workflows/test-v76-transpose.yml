name: EQE v76 - transposición ±12 semitonos
on:
  push:
    branches: [release-v76-transpose-12-20261010]
    paths: ['.github/workflows/test-v76-transpose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semitone-and-offline-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify ±12 semitones in iPhone/iPad/desktop
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/eqe-v76-test.log 2>&1 &
          sleep 2
          node scripts/test-transpose-12.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eqe-v76-semitone-visual-tests
          path: ui-review/
          retention-days: 14
          if-no-files-found: warn
