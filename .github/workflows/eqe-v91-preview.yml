name: EQE v91 - Vista previa aislada
on:
  push:
    branches: [feat/eqe-auto-chords-current-v91]
    paths:
      - 'public/**'
      - 'src/staging-worker.js'
      - 'wrangler.staging.jsonc'
      - 'scripts/test-repeated-chords.cjs'
      - '.github/workflows/eqe-v91-preview.yml'
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar cambios
        run: |
          node scripts/test-pwa-version.cjs
          node scripts/test-repeated-chords.cjs
          node scripts/test-eqe-global-regressions.cjs
      - name: Desplegar SOLO vista previa sin D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EQE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EQE_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.staging.jsonc
