name: EQE - alineación segura de acordes en 3 canciones sin acordes
on:
  push:
    branches: [audit-current-86-priority-20261010]
    paths: ['.github/workflows/eqe-strict-alignment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  align-original-source-with-existing-lyrics:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - name: Build verified Ultimate Guitar search/fetch implementation
        run: |
          pip install requests beautifulsoup4
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ultimate-guitar-scraper
          cp scripts/ug_audit.go /tmp/ultimate-guitar-scraper/ug_audit.go
          (cd /tmp/ultimate-guitar-scraper && go build -o /tmp/ug-audit ./ug_audit.go)
      - name: Compare split lyric rows to pinned chord tabs and map only matching words
        env:
          LIVE_BASE: 'https://crimson-rice-1fe1.joseduqueparedes.workers.dev'
          UG_HELPER: '/tmp/ug-audit'
          REQUEST_DELAY: '2'
        run: |
          python -m py_compile scripts/strict_line_chords_86.py
          python scripts/strict_line_chords_86.py
      - name: Keep only chord proposals, not external lyrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EQE-86-StrictlyMatched-ChordPositions
          path: eqe-86-strict-placement/*.json
          retention-days: 21
          if-no-files-found: warn
