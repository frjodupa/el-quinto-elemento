name: Build EQE PWA icons from supplied artwork
on:
  push:
    branches:
      - release-v71-mobile-live-cleanup-20261010
    paths:
      - '.github/workflows/build-eqe-pwa-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v71-mobile-live-cleanup-20261010
          persist-credentials: true
      - name: Resize official logo for Apple and PWA
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path("public")
          src = Image.open(root / "pwa-logo-source.png").convert("RGB")
          for size, filename in (
              (180, "apple-touch-icon.png"),
              (192, "icon-192.png"),
              (512, "icon-512.png"),
          ):
              img = src.resize((size, size), Image.Resampling.LANCZOS)
              img.save(root / filename, format="PNG", optimize=True)
              assert Image.open(root / filename).size == (size, size)
              print(filename, (root / filename).stat().st_size, "bytes")
          PY
      - name: Commit icon assets only to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apple-touch-icon.png public/icon-192.png public/icon-512.png
          if git diff --cached --quiet; then
            echo "Icons unchanged"
          else
            git commit -m "assets: replace Apple and PWA icons with EQE artwork"
            git push origin HEAD:release-v71-mobile-live-cleanup-20261010
          fi
