name: EQE - Depedro acordes de fuente accesible a versos originales (solo lectura)
on:
  push:
    branches: [audit-repeated-chord-lines-86-20261010]
    paths: [.github/workflows/audit-depedro-public.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Map source chord markup to stored lyrics (read only)
        run: |
          python -m py_compile scripts/audit_depedro_public_chords.py
          python scripts/audit_depedro_public_chords.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-depedro-original-chord-review
          path: eqe-depedro-audit/DE_PEDRO_AUDIT.json
          retention-days: 21
          if-no-files-found: warn
