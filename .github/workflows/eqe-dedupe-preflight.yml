name: EQE - Inventario y deduplicación segura (solo lectura)
on:
  push:
    branches: [audit-dedupe-chords-v75-20261010]
    paths: [.github/workflows/eqe-dedupe-preflight.yml]
permissions:
  contents: read
jobs:
  validate-all-99:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependencias mínimas
        run: pip install requests beautifulsoup4
      - name: Auditar 99 canciones y simular limpieza de duplicados
        env:
          APPLY_DEDUPE: "0"
          EQE_DEDUPE_DIR: dedupe_output
        run: |
          python -m py_compile scripts/audit_songbook.py scripts/eqe_dedupe_safe.py
          python scripts/eqe_dedupe_safe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-deduplicacion-99-preflight
          path: dedupe_output/DEDUPE_PREFLIGHT.json
          retention-days: 21
          if-no-files-found: warn
