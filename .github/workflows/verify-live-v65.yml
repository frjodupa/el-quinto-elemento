name: Verify live v65

on:
  push:
    branches:
      - verify-live-v65-20261010
    paths:
      - ".github/workflows/verify-live-v65.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Worker
        run: |
          set -e
          URL="https://crimson-rice-1fe1.joseduqueparedes.workers.dev"
          echo "Fetching $URL"
          curl -fsSL -D /tmp/headers.txt "$URL/?verify=$(date +%s)" -o /tmp/index.html
          echo "=== HEADERS ==="
          cat /tmp/headers.txt
          echo "=== VERSION MARKERS ==="
          grep -oE 'v[0-9]+' /tmp/index.html | sort -u | tail -20 || true
          echo "=== DIRECT UI ==="
          if grep -q 'class="top directHome"' /tmp/index.html; then
            echo "DIRECT_UI=YES"
          else
            echo "DIRECT_UI=NO"
          fi
          if grep -q 'class="uiVersion">v70' /tmp/index.html; then
            echo "UI_V70=YES"
          else
            echo "UI_V70=NO"
          fi
          echo "=== SONG DIRECT UI ==="
          if grep -q 'class="bar directSongBar"' /tmp/index.html; then
            echo "DIRECT_SONG_BAR=YES"
          else
            echo "DIRECT_SONG_BAR=NO"
          fi
          if grep -q 'id="directTransposeDown"' /tmp/index.html && grep -q 'id="directTransposeUp"' /tmp/index.html; then
            echo "QUICK_TRANSPOSE=YES"
          else
            echo "QUICK_TRANSPOSE=NO"
          fi

          echo "=== CONTEXT SETTINGS ==="
          if grep -q 'id="settingsAdvancedToggle"' /tmp/index.html && grep -q 'qeContextHidden' /tmp/index.html; then
            echo "CONTEXT_SETTINGS=YES"
          else
            echo "CONTEXT_SETTINGS=NO"
          fi

          echo "=== DIRECT PASS UI ==="
          if grep -q 'class="passPanel directPassPanel"' /tmp/index.html && grep -q 'id="editPassBtn"' /tmp/index.html; then
            echo "DIRECT_PASS_UI=YES"
          else
            echo "DIRECT_PASS_UI=NO"
          fi

          echo "=== INTERNET SEARCH ==="
          curl -fsSL "$URL/api/song-search?q=corazon%20de%20neon&verify=$(date +%s)" -o /tmp/song-search.json || true
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/song-search.json')
          if not p.exists():
              print('INTERNET_SEARCH=MISSING')
          else:
              try:
                  j=json.loads(p.read_text(encoding='utf-8'))
                  results=j.get('results') or []
                  print('INTERNET_SEARCH=YES' if j.get('ok') else 'INTERNET_SEARCH=NO')
                  print('INTERNET_RESULTS='+str(len(results)))
                  print('INTERNET_SOURCES='+','.join(sorted({str(x.get('source')) for x in results if x.get('source')})))
                  print('INTERNET_ERRORS='+json.dumps(j.get('errors') or [],ensure_ascii=False))
                  if results:
                      first=results[0]
                      print('FIRST_SOURCE='+str(first.get('source')))
                      print('FIRST_TITLE='+str(first.get('title')))
                      print('FIRST_ID='+str(first.get('id')))
                      print('FIRST_URL='+str(first.get('url')))
                      pathlib.Path('/tmp/first-result.json').write_text(json.dumps(first),encoding='utf-8')
              except Exception as e:
                  print('INTERNET_SEARCH=NO')
                  print(type(e).__name__+': '+str(e))
          PY

          echo "=== UG RAW FORMAT ==="
          python - <<'PY'
          import requests, hashlib, secrets, datetime, re, json
          tab_id=1574782
          device=secrets.token_hex(8)
          now=datetime.datetime.utcnow()
          payload=f"{device}{now:%Y-%m-%d}:{now.hour}createLog()".encode()
          key=hashlib.md5(payload).hexdigest()
          h={
              "Accept-Charset":"utf-8",
              "Accept":"application/json",
              "User-Agent":"UGT_ANDROID/4.11.1 (Pixel; 8.1.0)",
              "Connection":"close",
              "X-UG-CLIENT-ID":device,
              "X-UG-API-KEY":key,
          }
          u=f"https://api.ultimate-guitar.com/api/v1/tab/info?tab_id={tab_id}&tab_access_type=private"
          d=requests.get(u,headers=h,timeout=20).json()
          content=str(d.get("content") or "")
          lines=content.splitlines()
          ch=[x for x in lines if "[ch]" in x.lower()]
          chord_only=0
          inline=0
          samples=[]
          for line in ch:
              stripped=re.sub(r"\[ch\].*?\[/ch\]","",line,flags=re.I)
              stripped=re.sub(r"\[/?(?:tab|ch)\]","",stripped,flags=re.I).strip()
              if stripped:
                  inline+=1
                  kind="inline"
              else:
                  chord_only+=1
                  kind="chord_only"
              if len(samples)<8:
                  chords=re.findall(r"\[ch\](.*?)\[/ch\]",line,flags=re.I)
                  samples.append({"kind":kind,"chords":chords,"non_chord_chars":len(stripped)})
          print("UG_RAW_LINES="+str(len(lines)))
          print("UG_CH_LINES="+str(len(ch)))
          print("UG_CHORD_ONLY_LINES="+str(chord_only))
          print("UG_INLINE_CHORD_LINES="+str(inline))
          print("UG_PATTERN_SAMPLES="+json.dumps(samples,ensure_ascii=False))
          PY

          echo "=== INTERNET FETCH ==="
          if [ -f /tmp/first-result.json ]; then
            python - <<'PY' >/tmp/song-fetch-body.json
          import json
          r=json.load(open('/tmp/first-result.json'))
          print(json.dumps({"source":r.get("source"),"id":r.get("id"),"url":r.get("url")}))
          PY
            curl -fsSL -X POST "$URL/api/song-fetch" -H 'Content-Type: application/json' --data-binary @/tmp/song-fetch-body.json -o /tmp/song-fetch.json || true
            python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/song-fetch.json')
          if not p.exists():
              print('INTERNET_FETCH=MISSING')
          else:
              try:
                  j=json.loads(p.read_text(encoding='utf-8'))
                  s=j.get('song') or {}
                  print('INTERNET_FETCH=YES' if j.get('ok') else 'INTERNET_FETCH=NO')
                  print('FETCH_SOURCE='+str(s.get('source')))
                  print('FETCH_TITLE='+str(s.get('title')))
                  print('FETCH_LINES='+str(s.get('lineCount')))
                  print('FETCH_CHORDS='+str(s.get('chordCount')))
                  print('FETCH_HAS_TEXT='+('YES' if bool(s.get('text')) else 'NO'))
                  d=s.get('chordData') or {}
                  print('FETCH_HAS_STRUCTURE='+('YES' if all(k in d for k in ('lines','words','intro','instrumentals','references')) else 'NO'))
              except Exception as e:
                  print('INTERNET_FETCH=NO')
                  print(type(e).__name__+': '+str(e))
          PY
          fi

          echo "=== EXPORT ENDPOINT ==="
          curl -fsSL -D /tmp/export_headers.txt "$URL/export?verify=$(date +%s)" -o /tmp/export.json || true
          cat /tmp/export_headers.txt || true
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/export.json')
          if not p.exists():
              print('EXPORT_BODY=missing')
          else:
              print('EXPORT_BYTES='+str(p.stat().st_size))
              try:
                  j=json.loads(p.read_text(encoding='utf-8'))
                  print('EXPORT_JSON=YES')
                  print('EXPORT_VERSION='+str(j.get('version')))
                  print('EXPORT_BUILD='+str(j.get('buildVersion')))
              except Exception as e:
                  print('EXPORT_JSON=NO')
                  print(type(e).__name__+': '+str(e))
          PY

          echo "=== OFFLINE VERSION ==="
          curl -fsSL "$URL/version.json?verify=$(date +%s)" -o /tmp/version.json
          cat /tmp/version.json
          curl -fsSL "$URL/sw.js?verify=$(date +%s)" -o /tmp/sw.js
          if grep -q "quinto-elemento-v74" /tmp/sw.js; then
            echo "SW_CACHE_74=YES"
          else
            echo "SW_CACHE_74=NO"
          fi
          if grep -q '"version": 74' /tmp/version.json; then
            echo "VERSION_JSON_74=YES"
          else
            echo "VERSION_JSON_74=NO"
          fi

          echo "=== LIVE D1 STATE ==="
          curl -fsSL "$URL/api/sync?verify=$(date +%s)" -o /tmp/sync.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/sync.json',encoding='utf-8'))
          data=j.get('data') or {}
          def count_chords(obj):
              if not isinstance(obj,dict): return 0
              def seq_count(v):
                  if not isinstance(v,str) or not v.strip(): return 0
                  return max(1,len([x for x in v.replace('·',' ').split() if x.strip()]))
              n=0
              for v in (obj.get('words') or {}).values():
                  n += seq_count(v)
              for v in (obj.get('lines') or {}).values():
                  n += seq_count(v)
              n += seq_count(obj.get('intro') or '')
              for v in (obj.get('instrumentals') or {}).values():
                  n += seq_count(v)
              return n
          for sid in ('4','6','73','78','87','92'):
              raw=data.get(f'quintoElemento.chords.v2.{sid}','{}')
              try: obj=json.loads(raw)
              except Exception: obj={}
              print(f'ID_{sid}_CHORDS={count_chords(obj)}')
          print('SYNC_UPDATED_AT='+str(j.get('updatedAt')))
          PY
