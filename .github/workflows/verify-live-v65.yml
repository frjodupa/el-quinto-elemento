name: Verify live v65

on:
  push:
    branches:
      - verify-live-v65-20261010
    paths:
      - ".github/workflows/verify-live-v65.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Worker
        run: |
          set -e
          URL="https://crimson-rice-1fe1.joseduqueparedes.workers.dev/"
          echo "Fetching $URL"
          curl -fsSL -D /tmp/headers.txt "$URL?verify=$(date +%s)" -o /tmp/index.html
          echo "=== HEADERS ==="
          cat /tmp/headers.txt
          echo "=== VERSION MARKERS ==="
          grep -oE 'v[0-9]+' /tmp/index.html | sort -u | tail -20 || true
          echo "=== DIRECT UI ==="
          if grep -q 'class="top directHome"' /tmp/index.html; then
            echo "DIRECT_UI=YES"
          else
            echo "DIRECT_UI=NO"
          fi
          if grep -q 'class="uiVersion">v65' /tmp/index.html; then
            echo "UI_V65=YES"
          else
            echo "UI_V65=NO"
          fi
          echo "=== EXPORT ENDPOINT ==="
          curl -fsSL -D /tmp/export_headers.txt "$URL/export?verify=$(date +%s)" -o /tmp/export.json || true
          cat /tmp/export_headers.txt || true
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/export.json')
          if not p.exists():
              print('EXPORT_BODY=missing')
          else:
              print('EXPORT_BYTES='+str(p.stat().st_size))
              try:
                  j=json.loads(p.read_text(encoding='utf-8'))
                  print('EXPORT_JSON=YES')
                  print('EXPORT_VERSION='+str(j.get('version')))
                  print('EXPORT_BUILD='+str(j.get('buildVersion')))
              except Exception as e:
                  print('EXPORT_JSON=NO')
                  print(type(e).__name__+': '+str(e))
          PY

          echo "=== LIVE D1 STATE ==="
          curl -fsSL "$URL/api/sync?verify=$(date +%s)" -o /tmp/sync.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/sync.json',encoding='utf-8'))
          data=j.get('data') or {}
          def count_chords(obj):
              if not isinstance(obj,dict): return 0
              def seq_count(v):
                  if not isinstance(v,str) or not v.strip(): return 0
                  return max(1,len([x for x in v.replace('·',' ').split() if x.strip()]))
              n=0
              for v in (obj.get('words') or {}).values():
                  n += seq_count(v)
              for v in (obj.get('lines') or {}).values():
                  n += seq_count(v)
              n += seq_count(obj.get('intro') or '')
              for v in (obj.get('instrumentals') or {}).values():
                  n += seq_count(v)
              return n
          for sid in ('4','6','73','78','87','92'):
              raw=data.get(f'quintoElemento.chords.v2.{sid}','{}')
              try: obj=json.loads(raw)
              except Exception: obj={}
              print(f'ID_{sid}_CHORDS={count_chords(obj)}')
          print('SYNC_UPDATED_AT='+str(j.get('updatedAt')))
          PY
