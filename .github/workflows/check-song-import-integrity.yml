name: EQE chord import integrity diagnostics
on:
  pull_request:
    paths:
      - 'src/worker.js'
      - 'scripts/test-song-import-integrity.cjs'
      - '.github/workflows/check-song-import-integrity.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only parser diagnostics
        run: node scripts/test-song-import-integrity.cjs
