name: EQE premium UI visual QA
on:
  push:
    branches: [release-v72-premium-stage-ux-20261010]
    paths:
      - ".github/workflows/check-premium-ui.yml"
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate premium UI in local preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/eqe-http.log 2>&1 &
          sleep 2
          node scripts/test-premium-ui.cjs
          node scripts/test-premium-offline.cjs
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqe-premium-ui-browser-review
          path: ui-review/
          retention-days: 14
          if-no-files-found: warn
