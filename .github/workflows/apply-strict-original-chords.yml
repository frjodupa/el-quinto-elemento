name: EQE - aplicar acordes originales verificados con backup
on:
  push:
    branches: [apply-strict-original-chords-86-20261010]
    paths: [.github/workflows/apply-strict-original-chords.yml]
permissions:
  contents: read
jobs:
  guarded-source-update:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Compile original GitHub extractor
        run: |
          python -m pip install requests beautifulsoup4
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ug-src
          cp scripts/ug_audit.go /tmp/ug-src/ug_audit.go
          (cd /tmp/ug-src && go build -o /tmp/ug-audit ./ug_audit.go)
      - name: Recheck live songbook, source hashes and keys, backup then apply only accepted chord locations
        env:
          UG_HELPER: /tmp/ug-audit
          REQUEST_DELAY: "2"
          APPLY_ORIGINAL_STRICT: "1"
        run: |
          python -m py_compile scripts/strict_original_patch_candidates.py
          python scripts/strict_original_patch_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-original-chords-applied-with-D1-backup
          path: |
            eqe-original-song-strict/EXTERNAL_STRICT_PREFLIGHT.json
            eqe-original-song-strict/EXTERNAL_STRICT_APPLIED.json
          retention-days: 21
          if-no-files-found: warn
