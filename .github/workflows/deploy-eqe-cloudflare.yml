name: EQE - Publicar PWA en Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eqe-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verificar y publicar Cancionero EQE
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify project identity and resources
        shell: bash
        run: |
          test -f wrangler.jsonc
          test -f public/index.html
          test -f public/premium.css
          test -f public/sw.js
          grep -q '"name": "crimson-rice-1fe1"' wrangler.jsonc
          grep -q '"binding": "DB"' wrangler.jsonc
          node scripts/test-pwa-version.cjs
          grep -q 'premium.css?v=86' public/index.html
      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EQE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EQE_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Falta EQE_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Falta EQE_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Publish existing Worker with static assets and D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EQE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.EQE_CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
