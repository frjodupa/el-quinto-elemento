name: EQE aplicar 5 correcciones verificadas con backup D1
on:
  push:
    branches: [apply-verified-eqe-chords-20261010]
    paths: [".github/workflows/apply-verified-five.yml"]
permissions:
  contents: read
jobs:
  apply-exact-verified-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - name: Prepare verified exact-source scraper
        run: |
          pip install requests beautifulsoup4
          git clone --depth 1 https://github.com/Pilfer/ultimate-guitar-scraper.git /tmp/ultimate-guitar-scraper
          cp scripts/ug_audit.go /tmp/ultimate-guitar-scraper/ug_audit.go
          (cd /tmp/ultimate-guitar-scraper && go build -o /tmp/ug-audit ./ug_audit.go)
      - name: Apply only source-pinned five chord maps to current D1 with mandatory backup
        env:
          LIVE_BASE: "https://crimson-rice-1fe1.joseduqueparedes.workers.dev"
          UG_HELPER: "/tmp/ug-audit"
          REQUEST_DELAY: "2"
          ALLOW_LIVE_WRITE: "1"
        run: |
          python -m py_compile scripts/audit_songbook.py scripts/apply_verified_chord_patch.py
          python scripts/apply_verified_chord_patch.py
      - name: Upload non-sensitive result metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqe-five-verified-chords-applied
          path: |
            safe_patch_output/PATCH_VALIDATION.json
            safe_patch_output/PATCH_APPLIED_STATUS.json
          retention-days: 30
          if-no-files-found: warn
