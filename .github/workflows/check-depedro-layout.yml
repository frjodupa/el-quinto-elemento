name: EQE - estructura de acordes Depedro accesible (solo lectura)
on:
  push:
    branches: [audit-repeated-chord-lines-86-20261010]
    paths: [.github/workflows/check-depedro-layout.yml]
permissions:
  contents: read
jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Compare chord/lyric line order without displaying copyrighted lyrics
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          import sys
          sys.path.insert(0,'scripts')
          import audit_songbook as a
          url='https://acordesweb.com/cancion/depedro/te-sigo-sonando'
          r=requests.get(url,timeout=25,headers={'User-Agent':'EQE Source Audit/1.0'})
          r.raise_for_status()
          pre=BeautifulSoup(r.text,'html.parser').select_one('#chordsPre')
          if not pre:raise RuntimeError('no pre')
          for label,text in [('emptysep',pre.get_text('',strip=False)),('newlinesep',pre.get_text('\n',strip=False))]:
              print('SOURCE_LAYOUT='+label+' chars='+str(len(text))+' lines='+str(len(text.splitlines())),flush=True)
              for i,line in enumerate(text.splitlines()[:48]):
                  s=line.strip()
                  if not s:kind='BLANK'
                  elif a.chord_line(s):kind='CHORD'
                  elif len(s.split())>=2:kind='LYRIC'
                  else:kind='LABEL'
                  if kind=='CHORD':
                      # Chord symbols are allowed; never output the song lyrics.
                      shown=' '.join(s.split()[:8])
                  else:
                      shown='n_words='+str(len(s.split()))+' n_chars='+str(len(s))
                  print(f'ROW {label} {i:02d} {kind} {shown}',flush=True)
          PY
