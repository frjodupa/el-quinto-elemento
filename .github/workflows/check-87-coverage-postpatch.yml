name: EQE 87 - verificar cobertura actual tras mejoras
on:
  push:
    branches: [audit-87-exact-stanza-repeat-20261010]
    paths: [".github/workflows/check-87-coverage-postpatch.yml"]
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install requests beautifulsoup4
      - name: Verificar 87 canciones, cobertura y 23 referencias de La Pasma
        run: |
          python -m py_compile scripts/audit_current_chord_coverage.py
          python scripts/audit_current_chord_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-87-coverage-after-repeat-patch
          path: |
            eqe-current-audit/LINE_COVERAGE_FULL.json
            eqe-current-audit/AUDITORIA_COBERTURA.md
          retention-days: 21
          if-no-files-found: warn
