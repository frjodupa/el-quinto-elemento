name: EQE - comprobar acceso a cifras originales para 5 casos difíciles
on:
  push:
    branches: [audit-repeated-chord-lines-86-20261010]
    paths: [.github/workflows/probe-original-cifras.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check only public source access (no scraping bypass, no copying lyrics)
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          items={
            "AQUI_NO_HAY_PLAYA":"https://www.cifraclub.com/los-refrescos/aqui-no-hay-playa/",
            "ESPALDAS_MOJADAS":"https://www.cifraclub.com/tam-tam-go/espaldas-mojadas/",
            "TE_SIGO_SONANDO":"https://www.cifraclub.com/depedro/te-sigo-sonando/kthgwm.html",
            "ESCUELA_DE_CALOR":"https://www.cifraclub.com/radio-futura/escuela-de-calor/tzgkmw.html",
            "MI_AGUITA_AMARILLA":"https://www.cifraclub.com/toreros-muertos/mi-aguita-amarilla/ptpgzj.html",
            "DE_PEDRO_ALTERNATIVA":"https://acordesweb.com/cancion/depedro/te-sigo-sonando",
            "ESCUELA_ALTERNATIVA":"https://www.losacordes.com/acordes/radio-futura/escuela-de-calor",
          }
          for name,url in items.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 EQE-SourceAudit/1.0'})
              with urllib.request.urlopen(req,timeout=14) as r:
                html=r.read(300_000).decode('utf-8','replace')
                print('SOURCE_ACCESS='+name+' STATUS='+str(r.status)+' BYTES='+str(len(html))+' PRE='+str('<pre' in html.lower())+' CIFRA='+str('cifra_cnt' in html))
            except urllib.error.HTTPError as e:
              print('SOURCE_ACCESS='+name+' STATUS='+str(e.code))
            except Exception as e:
              print('SOURCE_ACCESS='+name+' ERROR='+type(e).__name__)
          PY
