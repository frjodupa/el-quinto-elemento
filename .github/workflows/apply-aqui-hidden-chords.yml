name: EQE - recuperar 93 acordes ocultos de Aqui no hay playa con backup
on:
  push:
    branches: [apply-aqui-hidden-chords-20261010]
    paths: [.github/workflows/apply-aqui-hidden-chords.yml]
permissions:
  contents: read
jobs:
  guarded-import-original-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: pip install requests beautifulsoup4
      - name: Backup D1; convert 31 isolated rows; preserve existing lyrics & pass order
        env:
          LIVE_BASE: https://crimson-rice-1fe1.joseduqueparedes.workers.dev
          APPLY_AQUI_SCAFFOLDS: '1'
        run: |
          python -m py_compile scripts/convert_aqui_embedded_chords.py
          python scripts/convert_aqui_embedded_chords.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EQE-Aqui-No-Hay-Playa-recovered-93-chords-verified
          path: |
            eqe-aqui-chord-conversion/PREVIEW.json
            eqe-aqui-chord-conversion/APPLIED.json
          retention-days: 30
          if-no-files-found: warn
